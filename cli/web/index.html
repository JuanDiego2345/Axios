<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axios — Traductor interespecie</title>
<style>
  :root {
    --fondo: #f6f7f9; --panel: #ffffff; --texto: #1b1f24; --suave: #5b6470;
    --borde: #dde1e6; --acento: #2f5bd3; --acento-texto: #ffffff;
    --ok: #1d7a46; --ok-fondo: #e7f5ed; --error: #b42318; --error-fondo: #fdecea;
    --aviso: #8a5a00; --aviso-fondo: #fff5e0; --codigo: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #12151a; --panel: #1a1e25; --texto: #e6e9ee; --suave: #9aa3af;
      --borde: #2c323c; --acento: #7c9cff; --acento-texto: #0d1020;
      --ok: #5fd08f; --ok-fondo: #15291e; --error: #ff8a80; --error-fondo: #2e1716;
      --aviso: #f2c66d; --aviso-fondo: #2c2412; --codigo: #222731;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--fondo); color: var(--texto); }
  header { padding: 20px 24px 0; max-width: 980px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; color: var(--suave); }
  nav { display: flex; gap: 4px; max-width: 980px; margin: 16px auto 0; padding: 0 24px;
        border-bottom: 1px solid var(--borde); }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent;
               padding: 10px 14px; font: inherit; color: var(--suave); cursor: pointer; }
  nav button[aria-selected="true"] { color: var(--texto); border-color: var(--acento); font-weight: 600; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 24px 48px; }
  section[hidden] { display: none; }
  .panel { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px;
           padding: 16px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .fila { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text], input[type=date] { flex: 1; min-width: 200px; padding: 10px 12px; font: inherit;
         color: var(--texto); background: var(--fondo); border: 1px solid var(--borde); border-radius: 8px; }
  button.primario { padding: 10px 18px; font: inherit; font-weight: 600; border: 0; border-radius: 8px;
         background: var(--acento); color: var(--acento-texto); cursor: pointer; }
  button.primario:disabled { opacity: .6; cursor: wait; }
  .check { font-weight: normal; display: inline-flex; gap: 6px; align-items: center; color: var(--suave); }
  .ejemplos { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .ejemplos button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px;
         border: 1px solid var(--borde); background: var(--fondo); color: var(--texto); cursor: pointer; }
  .lenguas { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .lenguas { grid-template-columns: 1fr; } }
  .lengua h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); }
  .transcripcion { font: 20px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; word-break: break-word; }
  .estado { border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
  .estado.ok { background: var(--ok-fondo); color: var(--ok); }
  .estado.error { background: var(--error-fondo); color: var(--error); }
  .estado.aviso { background: var(--aviso-fondo); color: var(--aviso); }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--suave); }
  pre { background: var(--codigo); padding: 10px 12px; border-radius: 8px; overflow-x: auto;
        font: 13px/1.5 ui-monospace, Consolas, monospace; margin: 8px 0 0; white-space: pre-wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--borde); vertical-align: top; }
  th { color: var(--suave); font-weight: 600; }
  td.mono { font-family: ui-monospace, Consolas, monospace; }
  .vacio { color: var(--suave); }
</style>
</head>
<body>
<header>
  <h1>Axios · Traductor interespecie</h1>
  <p>Español → Kethari y Ozh. Siempre en las dos lenguas: nadie sabe cuál de las dos voces escucha.</p>
</header>

<nav role="tablist">
  <button role="tab" aria-selected="true" data-tab="traducir">Traducir</button>
  <button role="tab" aria-selected="false" data-tab="cargar">Cargar</button>
  <button role="tab" aria-selected="false" data-tab="historial">Historial</button>
  <button role="tab" aria-selected="false" data-tab="palabra">Palabra</button>
</nav>

<main>
  <!-- TRADUCIR -->
  <section id="traducir">
    <div class="panel">
      <label for="pregunta">Pregunta en español</label>
      <form class="fila" id="form-traducir">
        <input type="text" id="pregunta" placeholder="¿Cuándo vendrán ustedes?" autocomplete="off">
        <button class="primario" type="submit">Traducir</button>
      </form>
      <div class="ejemplos" id="ejemplos"></div>
    </div>
    <div id="resultado"></div>
  </section>

  <!-- CARGAR -->
  <section id="cargar" hidden>
    <div class="panel">
      <label for="archivo">Archivo de señales, correcciones del manual o léxico</label>
      <p class="vacio">Formatos: <code>SENAL|…</code> / <code>CORRECCION|…</code> de Axios, o CSV
        (<code>lema_es,categoria,kethari,ozh</code>). Se incorpora sin recompilar.</p>
      <form class="fila" id="form-cargar">
        <input type="file" id="archivo" accept=".txt,.csv">
        <button class="primario" type="submit">Cargar</button>
      </form>
      <div id="resultado-carga"></div>
    </div>
  </section>

  <!-- HISTORIAL -->
  <section id="historial" hidden>
    <div class="panel">
      <form class="fila" id="form-historial">
        <label class="check" for="desde">Desde</label>
        <input type="date" id="desde">
        <button class="primario" type="submit">Ver historial</button>
      </form>
    </div>
    <div class="panel" id="tabla-historial"><p class="vacio">Pulsa «Ver historial».</p></div>
  </section>

  <!-- PALABRA -->
  <section id="palabra" hidden>
    <div class="panel">
      <form class="fila" id="form-palabra">
        <input type="text" id="termino" placeholder="tierra" autocomplete="off">
        <button class="primario" type="submit">Buscar</button>
      </form>
      <div id="resultado-palabra"></div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

function el(tag, attrs = {}, ...hijos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else e.setAttribute(k, v);
  }
  for (const h of hijos) if (h != null) e.append(h instanceof Node ? h : String(h));
  return e;
}

async function pedir(url, opciones) {
  const r = await fetch(url, opciones);
  const datos = await r.json().catch(() => ({ error: 'Respuesta inválida del servidor' }));
  if (!r.ok) throw new Error(datos.error || r.statusText);
  return datos;
}

// Pestañas
document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach((x) => x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('main section').forEach((s) => s.hidden = s.id !== b.dataset.tab);
}));

// Ejemplos (preguntas de las señales)
['¿Cuándo vendrán ustedes?', '¿Quién envió el mensaje?', 'Quince naves llegaron',
 'Nosotros esperaremos seis ciclos', 'Ellos no quieren territorios reclamados.',
 '¿Quieren nuestra tierra?', 'cuando llegaran'].forEach((t) => {
  const b = el('button', { type: 'button' }, t);
  b.onclick = () => { $('pregunta').value = t; $('form-traducir').requestSubmit(); };
  $('ejemplos').append(b);
});

function tarjetaLengua(nombre, r) {
  const caja = el('div', { class: 'panel lengua' }, el('h3', {}, nombre));
  if (!r) {
    caja.append(el('div', { class: 'estado error' }, 'Sin traducción: la pregunta no llegó al generador.'));
    return caja;
  }
  if (r.texto) {
    caja.append(el('div', { class: 'transcripcion' }, r.texto));
  } else {
    caja.append(el('div', { class: 'estado error' }, 'Sin traducción: ' + r.error));
  }
  return caja;
}

function lista(items) {
  const ul = el('ul');
  items.forEach((i) => ul.append(el('li', {}, i)));
  return ul;
}

$('form-traducir').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const pregunta = $('pregunta').value.trim();
  const caja = $('resultado');
  if (!pregunta) return;
  const boton = ev.target.querySelector('button');
  boton.disabled = true;
  caja.replaceChildren(el('p', { class: 'vacio' }, 'Traduciendo…'));
  try {
    const r = await pedir('/api/traducir', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pregunta }),
    });
    const partes = [];

    if (r.correcciones.length || r.ajustesSignos.length) {
      const avisos = [
        ...r.correcciones.map((c) => `«${c.original}» se corrigió a «${c.corregida}» (distancia ${c.distancia})`),
        ...r.ajustesSignos,
      ];
      partes.push(el('div', { class: 'estado aviso' }, el('strong', {}, 'Correcciones: '), lista(avisos)));
    }
    if (r.errorSintactico) {
      partes.push(el('div', { class: 'estado error' },
        `No se entendió la pregunta (columna ${r.errorSintactico.columna}): ${r.errorSintactico.mensaje}`));
    }
    if (r.advertencias.length) {
      partes.push(el('div', { class: 'estado aviso' }, el('strong', {}, 'Decisiones tomadas: '), lista(r.advertencias)));
    }

    const lenguas = el('div', { class: 'lenguas' },
      tarjetaLengua('Kethari', r.kethari), tarjetaLengua('Ozh', r.ozh));

    const resumen = el('div', { class: 'panel' }, ...partes);
    resumen.prepend(el('div', { class: 'vacio' }, `Registrada en el historial (#${r.idHistorial ?? '—'})`));

    const salida = [resumen, lenguas];

    caja.replaceChildren(...salida);
  } catch (e) {
    caja.replaceChildren(el('div', { class: 'estado error' }, e.message));
  } finally {
    boton.disabled = false;
  }
});

$('form-cargar').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const archivo = $('archivo').files[0];
  const caja = $('resultado-carga');
  if (!archivo) { caja.replaceChildren(el('div', { class: 'estado aviso' }, 'Elige un archivo.')); return; }
  try {
    const contenido = await archivo.text();
    const r = await pedir('/api/cargar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre: archivo.name, contenido }),
    });
    caja.replaceChildren(el('div', { class: 'estado ok' },
      `Se cargó «${r.archivo}»: ${r.filas} filas (${r.tipo}). Las traducciones ya lo usan.`));
  } catch (e) {
    caja.replaceChildren(el('div', { class: 'estado error' }, 'No se cargó: ' + e.message));
  }
});

$('form-historial').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const caja = $('tabla-historial');
  try {
    const desde = $('desde').value;
    const filas = await pedir('/api/historial' + (desde ? '?desde=' + encodeURIComponent(desde) : ''));
    if (!filas.length) { caja.replaceChildren(el('p', { class: 'vacio' }, 'No hay preguntas registradas.')); return; }
    const tabla = el('table', {}, el('thead', {}, el('tr', {},
      ...['Fecha', 'Pregunta', 'Corregida', 'Kethari', 'Ozh', 'Validación'].map((t) => el('th', {}, t)))));
    const cuerpo = el('tbody');
    filas.slice().reverse().forEach((f) => cuerpo.append(el('tr', {},
      el('td', {}, f.fecha), el('td', {}, f.original), el('td', {}, f.corregido ?? '—'),
      el('td', { class: 'mono' }, f.kethari ?? '—'), el('td', { class: 'mono' }, f.ozh ?? '—'),
      el('td', {}, f.validacion ?? '—'))));
    tabla.append(cuerpo);
    caja.replaceChildren(tabla);
  } catch (e) {
    caja.replaceChildren(el('div', { class: 'estado error' }, e.message));
  }
});

$('form-palabra').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const termino = $('termino').value.trim();
  const caja = $('resultado-palabra');
  if (!termino) return;
  try {
    const p = await pedir('/api/palabra?termino=' + encodeURIComponent(termino));
    caja.replaceChildren(el('table', {}, el('tbody', {},
      el('tr', {}, el('th', {}, 'Español'), el('td', {}, `${p.lema} (${p.categoria})`)),
      el('tr', {}, el('th', {}, 'Kethari'), el('td', { class: 'mono' }, p.kethari || '(sin traducción)')),
      el('tr', {}, el('th', {}, 'Ozh'), el('td', { class: 'mono' }, p.ozh || '(sin traducción)')))));
  } catch (e) {
    caja.replaceChildren(el('div', { class: 'estado error' }, e.message));
  }
});
</script>
</body>
</html>
